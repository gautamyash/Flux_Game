
name: Publish EAS Update

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options:
          - preview
          - production
        required: true
        default: preview
      message:
        description: Release note for this update
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: eas-update-${{ github.event_name == 'push' && 'preview' || inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' || inputs.channel == 'preview' || (inputs.channel == 'production' && github.ref == 'refs/heads/main')
    name: Publish Android ${{ github.event_name == 'push' && 'preview' || inputs.channel }} update
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.event_name == 'push' && 'preview' || inputs.channel == 'production' && 'production' || 'preview' }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Gate automatic preview publishing on OTA-safe app changes
        id: changes
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          changed_files=$(git -C .. diff --name-only "$BEFORE" "$HEAD")
          has_ota_code=false
          has_native_change=false

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              app/App.tsx|app/index.ts|app/src/*|app/assets/*)
                has_ota_code=true
                ;;
            esac

            case "$file" in
              app/app.json|app/app.config.*|app/eas.json|app/package.json|app/package-lock.json|app/google-services.json|app/android/*|app/ios/*|app/plugins/*|app/metro.config.*|app/babel.config.*|app/tsconfig.json|app/.env*|app/assets/icon.png|app/assets/splash-icon.png|app/assets/splash-icon-dark.png|app/assets/android-icon-*)
                has_native_change=true
                ;;
            esac
          done <<< "$changed_files"

          if [[ "$has_native_change" == true ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping automatic OTA publish: this push includes native configuration, dependency, or native asset changes. Build a new Android APK before publishing updates for the new runtime."
          elif [[ "$has_ota_code" == true ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "OTA-compatible app source/assets changed; publishing preview update."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping automatic OTA publish: this push contains no bundled app source or compatible asset changes."
          fi

      - name: Check Expo access token
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.publish == 'true'
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions secret before publishing updates."
            exit 1
          fi

      - name: Set up Node.js
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.publish == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Expo and EAS CLI
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.publish == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.publish == 'true'
        run: npm ci

      - name: Publish OTA update
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.publish == 'true'
        shell: bash
        env:
          CHANNEL: ${{ github.event_name == 'push' && 'preview' || inputs.channel }}
          EAS_ENVIRONMENT: ${{ github.event_name == 'push' && 'preview' || inputs.channel == 'production' && 'production' || 'preview' }}
          UPDATE_MESSAGE: ${{ github.event_name == 'push' && github.event.head_commit.message || inputs.message }}
        run: |
          eas update \
            --channel "$CHANNEL" \
            --message "$UPDATE_MESSAGE" \
            --environment "$EAS_ENVIRONMENT" \
            --platform android \
            --non-interactive
