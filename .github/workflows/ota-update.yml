
name: Publish EAS Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options:
          - preview
          - production
        required: true
        default: preview
      message:
        description: Release note for this update
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: eas-update-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    if: inputs.channel == 'preview' || (inputs.channel == 'production' && github.ref == 'refs/heads/main')
    name: Publish Android ${{ inputs.channel }} update
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.channel == 'production' && 'production' || 'preview' }}

    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out selected commit
        uses: actions/checkout@v5

      - name: Check Expo access token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Add EXPO_TOKEN as a GitHub Actions secret before publishing updates."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install locked dependencies
        run: npm ci

      - name: Publish OTA update
        shell: bash
        env:
          CHANNEL: ${{ inputs.channel }}
          EAS_ENVIRONMENT: ${{ inputs.channel == 'production' && 'production' || 'preview' }}
          UPDATE_MESSAGE: ${{ inputs.message }}
        run: |
          eas update \
            --channel "$CHANNEL" \
            --message "$UPDATE_MESSAGE" \
            --environment "$EAS_ENVIRONMENT" \
            --platform android \
            --non-interactive
